        <!-- obj-1 -->
             <div class="obj-1">
                <h1>PLAY</h1>

             <div class="star-1"></div>

             <div class="star-2"></div>
        <!-- star 3 -->
             <div class="star-3"></div>
        <!-- player -->
             <div class="player">
                <!-- title-bar -->
                 <div class="title-bar">
                    <!-- dots -->
                    <div class="dots">
                        <div class="dot-one"></div>
                    <div class="dot-two"></div>
                    <div class="dot-three"></div>
                    </div>
                    <!-- dono ke naam (JS likhegi) -->
                    <div class="player-title" id="player-title"></div>
                    <!-- controls -->
                     <div class="controls">
                        <button type="button" class="control-3" id="minimize-button" aria-label="minimize">_</button>
                        <button type="button" class="control-2" id="maximize-button" aria-label="maximize">□</button>
                        <button type="button" class="control-1" id="close-button" aria-label="close">x</button>
                     </div>
                 </div>
                 <!-- player-body -->
                 <div class="player-body">
                    <input type="range" class="progress-bar" min="0" max="100" value="0" step="any">
                    <!-- buttons -->
                     <div class="buttons">
                        <div class="previous-button"><span>⏮︎</span></div>
                        <div class="play-button"><span>▶</span></div>
                        <div class="next-button"><span>⏭︎</span></div>
                     </div>
                 </div>
                 

             </div>
        <!-- player band ho to ye button - dobara kholne ke liye -->
             <button type="button" class="open-player hidden" id="open-player">open player 💿</button>
        <!-- obj-2 -->
         <div class="obj-2">
                <h1>COOL</h1>
             </div>
        
        <!-- flower -->
        <div class = "flower">
            <div class="flowermain"></div>
            <div class="petal petal-1"></div>
            <div class="petal petal-2"></div>
            <div class="petal petal-3"></div>
            <div class="petal petal-4"></div>

            <div class="petal petal-12"></div>
            <!-- <div class="petal petal-13"></div>
            <div class="petal petal-14"></div> -->
        </div>
        <!-- heart-bubble -->
         <div class="heart-sign">
            <div class="heart-bubble">
                <div class="heart">
                    <span class="right-circle"></span>
                    <span class="left-circle"></span>
                    <span class="main-square"></span>
                </div>
            </div>
         </div>
         <!-- pixel player -->
          <div class="pixel-player">
            <!-- mini title bar -->
            <div class="mini-title-bar">
                <div class="dots">
                    <div class="dot-one"></div>
                    <div class="dot-two"></div>
                    <div class="dot-three"></div>
                </div>
                <button type="button" class="mini-close" id="mini-close" aria-label="close">x</button>
            </div>
            <!-- mini body - yahan pixel hearts aayenge -->
            <div class="mini-body">
                <div class="pixel-heart"></div>
                <div class="pixel-heart"></div>
                <div class="pixel-heart"></div>
            </div>
          </div>
          <!-- mini window band ho to ye button - dobara kholne ke liye -->
          <button type="button" class="open-hearts hidden" id="open-hearts">show hearts 💗</button>
        <!-- music card button - player ke neeche -->
        <button type="button" class="card-button" id="card-button">get your card 💿</button>

        <!-- music card - preview aur download -->
        <div class="intro hidden" id="card-popup">
            <div class="intro-card card-popup-box">
                <div class="mini-title-bar">
                    <div class="dots">
                        <div class="dot-one"></div>
                        <div class="dot-two"></div>
                        <div class="dot-three"></div>
                    </div>
                    <div class="intro-title">music-card.png</div>
                    <button type="button" class="card-close" id="card-close" aria-label="close">x</button>
                </div>
                <div class="intro-body">
                    <canvas class="card-preview" id="card-canvas" width="1080" height="1350"></canvas>
                    <!-- kaun sa track download karna hai? -->
                    <div class="track-pick">
                        <span>which track?</span>
                        <div class="track-buttons" id="track-buttons">
                            <button type="button" data-track="0">side a</button>
                            <button type="button" data-track="1">side b</button>
                            <button type="button" data-track="2">lullaby</button>
                        </div>
                    </div>
                    <button type="button" class="intro-button" id="card-download">download video 🎬</button>
                </div>
            </div>
        </div>

        <!-- intro - naam pucho, phir birthday message (sab ke upar) -->
        <div class="intro" id="intro">
            <div class="intro-card">
                <div class="mini-title-bar">
                    <div class="dots">
                        <div class="dot-one"></div>
                        <div class="dot-two"></div>
                        <div class="dot-three"></div>
                    </div>
                    <div class="intro-title">mixtape.exe</div>
                </div>
                <div class="intro-body">
                    <!-- screen 1: naam -->
                    <form class="name-step" id="name-step">
                        <h2>make a mixtape 💿</h2>
                        <label for="from-name">your name</label>
                        <input type="text" id="from-name" maxlength="20" autocomplete="off">
                        <label for="to-name">your friend's name</label>
                        <input type="text" id="to-name" maxlength="20" autocomplete="off">
                        <p class="intro-error" id="intro-error"></p>
                        <button type="submit" class="intro-button">make my mixtape</button>
                    </form>
                    <!-- screen 2: birthday message -->
                    <div class="message-step hidden" id="message-step">
                        <h2><span>Happy Birthday</span> <span id="msg-to"></span>! 🎂</h2>
                        <p><span id="msg-from"></span> <span>made you a mixtape 💗</span><br><span>please listen</span></p>
                        <button type="button" class="intro-button" id="listen-button">listen ▶</button>
                        <button type="button" class="copy-link" id="copy-link">copy link to send 🔗</button>
                    </div>
                </div>
            </div>
        </div>
