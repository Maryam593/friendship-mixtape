<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- cassette ka saya (doodle wala kaala shadow) -->
  <rect x="5" y="13" width="56" height="42" rx="7" fill="black"/>
  <!-- cassette ka dabba -->
  <rect x="3" y="11" width="56" height="42" rx="7" fill="palevioletred" stroke="black" stroke-width="3"/>
  <!-- safed label -->
  <rect x="10" y="17" width="42" height="22" rx="4" fill="white" stroke="black" stroke-width="2.5"/>
  <!-- do reels (pahiye) -->
  <circle cx="21" cy="28" r="5" fill="yellow" stroke="black" stroke-width="2.5"/>
  <circle cx="41" cy="28" r="5" fill="yellow" stroke="black" stroke-width="2.5"/>
  <!-- beech mein chhota dil -->
  <path d="M31 33 l-3.2-3.2 a2 2 0 0 1 3.2-2.6 a2 2 0 0 1 3.2 2.6 z" fill="rgb(211,41,112)" stroke="black" stroke-width="1.2" stroke-linejoin="round"/>
  <!-- neeche wala hissa (jahan se tape dikhti hai) -->
  <path d="M16 53 l4-9 h22 l4 9" fill="plum" stroke="black" stroke-width="2.5" stroke-linejoin="round"/>
</svg>
